<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Sign in — Careers</title>
  <style>
    body { margin: 0; font: 15px/1.5 system-ui, sans-serif; }
    main { max-width: 420px; margin: 60px auto; padding: 0 24px; }
    label { display: block; margin: 14px 0 4px; font-weight: 600; font-size: 13px; }
    input { width: 100%; padding: 9px 11px; border: 1px solid #d4d4d8; border-radius: 6px; font: inherit; }
    button { margin-top: 18px; border: 0; border-radius: 6px; padding: 10px 18px;
             font: inherit; font-weight: 600; background: #fe2c55; color: #fff; cursor: pointer; }
    #application-root:empty { display: none; }
  </style>
</head>
<body>
  <main id="signin">
    <h1>Sign in to continue</h1>
    <form id="login-form">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" />
      <button type="submit" id="signin-submit">Sign in</button>
    </form>
    <p><a href="#create" id="create-account">Create an account</a></p>
  </main>

  <div id="application-root"></div>

  <script>
    window.__jobpilotFixture = { signedIn: false };

    // Simulated authentication: the test drives this the way a user would.
    document.getElementById("login-form").addEventListener("submit", (event) => {
      event.preventDefault();
      window.__jobpilotFixture.signedIn = true;
      document.getElementById("signin").style.display = "none";
      document.getElementById("application-root").innerHTML = `
        <main>
          <h1>Apply — Software Engineer</h1>
          <form id="application-form" action="/submit" method="post">
            <label for="first_name">First name</label><input id="first_name" name="first_name" required />
            <label for="last_name">Last name</label><input id="last_name" name="last_name" required />
            <label for="app_email">Email</label><input id="app_email" name="email" type="email" required />
            <label for="phone">Phone</label><input id="phone" name="phone" />
            <button type="submit" id="final-submit">Submit application</button>
          </form>
        </main>`;
    });
  </script>
</body>
</html>
