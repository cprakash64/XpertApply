<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Listing variants — application navigation</title>
  <style>
    body { margin: 0; font: 15px/1.5 system-ui, sans-serif; }
    header { display: flex; gap: 12px; padding: 12px 24px; border-bottom: 1px solid #ddd; }
    main { max-width: 820px; margin: 0 auto; padding: 28px 24px 200px; }
    .btn { border: 0; border-radius: 6px; padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer; background: #fe2c55; color: #fff; }
    .btn.ghost { background: #f4f4f5; color: #111; }
    /* A consent banner that genuinely covers the CTA (variant=blocked). */
    #blocking-overlay {
      position: fixed; inset: 0; z-index: 90; background: rgba(24,24,27,.92);
      color: #fff; display: none; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap;
    }
    body[data-variant="blocked"] #blocking-overlay { display: flex; }
    body[data-variant="consent-only"] #blocking-overlay { display: flex; }
    body[data-variant="consent-only"] #overlay-decline { display: none; }
    label { display: block; margin: 12px 0 4px; font-weight: 600; font-size: 13px; }
    input, textarea { width: 100%; padding: 9px 11px; border: 1px solid #d4d4d8; border-radius: 6px; font: inherit; }
  </style>
</head>
<body>
  <header>
    <strong>Careers</strong>
    <button class="btn ghost" id="header-apply">Apply</button>
  </header>

  <main id="listing">
    <h1>Staff Engineer, Platform</h1>
    <p>Own the platform that everything else runs on.</p>
    <button class="btn" id="primary-apply">Apply to this job</button>
  </main>

  <div id="blocking-overlay">
    <span>We use cookies.</span>
    <button class="btn" id="overlay-accept">Accept all</button>
    <button class="btn ghost" id="overlay-decline">Decline all</button>
  </div>

  <div id="mount"></div>

  <script>
    const params = new URLSearchParams(location.search);
    const variant = params.get("variant") || "same-tab";
    document.body.dataset.variant = variant;
    window.__jobpilotFixture = { clicks: [], variant, mounted: false };

    const APPLICATION_HTML = `
      <h1>Apply — Staff Engineer, Platform</h1>
      <form id="application-form" action="/applications/submit" method="post">
        <label for="first_name">First name</label><input id="first_name" name="first_name" required />
        <label for="last_name">Last name</label><input id="last_name" name="last_name" required />
        <label for="email">Email</label><input id="email" name="email" type="email" required />
        <label for="phone">Phone</label><input id="phone" name="phone" />
        <label for="why">Why this role?</label><textarea id="why" name="why"></textarea>
        <button type="submit" id="final-submit">Submit application</button>
      </form>`;

    const LOGIN_HTML = `
      <h1>Sign in</h1>
      <form id="login-form">
        <label for="login-email">Email</label><input id="login-email" name="email" type="email" />
        <label for="login-password">Password</label><input id="login-password" name="password" type="password" />
        <button type="submit">Sign in</button>
      </form>
      <a href="#forgot">Forgot your password?</a>`;

    function hideListing() {
      document.getElementById("listing").style.display = "none";
    }

    function applyVariant() {
      window.__jobpilotFixture.mounted = true;
      switch (variant) {
        case "login":
          hideListing();
          history.pushState({}, "", location.pathname + "?variant=login&step=signin");
          document.getElementById("mount").innerHTML = LOGIN_HTML;
          break;
        case "iframe": {
          hideListing();
          const frame = document.createElement("iframe");
          frame.id = "grnhse_iframe";
          frame.src = "data:text/html," + encodeURIComponent("<h1>Application</h1>");
          frame.style.cssText = "width:100%;height:420px;border:0";
          document.getElementById("mount").appendChild(frame);
          break;
        }
        case "no-effect":
          // Deliberately does nothing: proves the manual fallback path.
          window.__jobpilotFixture.mounted = false;
          break;
        default:
          hideListing();
          history.pushState({}, "", location.pathname + "?variant=" + variant + "&step=application");
          document.getElementById("mount").innerHTML = APPLICATION_HTML;
      }
    }

    document.getElementById("header-apply").addEventListener("click", () => {
      window.__jobpilotFixture.clicks.push("header-apply");
    });
    document.getElementById("overlay-accept").addEventListener("click", () => {
      window.__jobpilotFixture.clicks.push("overlay-accept");
      document.getElementById("blocking-overlay").style.display = "none";
    });
    document.getElementById("overlay-decline").addEventListener("click", () => {
      window.__jobpilotFixture.clicks.push("overlay-decline");
      document.getElementById("blocking-overlay").style.display = "none";
      document.body.dataset.variant = "same-tab";
    });

    // Requires a real pointer sequence, like the main fixture.
    const primary = document.getElementById("primary-apply");
    let sawPointerDown = false;
    primary.addEventListener("pointerdown", () => { sawPointerDown = true; });
    primary.addEventListener("click", (event) => {
      window.__jobpilotFixture.clicks.push("primary-apply:click");
      if (!sawPointerDown) {
        window.__jobpilotFixture.clicks.push("primary-apply:ignored-no-pointer");
        return;
      }
      event.preventDefault();
      window.__jobpilotFixture.clicks.push("primary-apply");
      applyVariant();
    });
  </script>
</body>
</html>
