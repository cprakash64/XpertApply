<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>XpertApply Assistant</title>
    <style>
      :root { color-scheme: light; --pine: #1f5e45; --line: #d8ddd2; --ink: #17211b; --muted: #5d675f; --panel: #f6f7f2; }
      * { box-sizing: border-box; }
      html, body { min-width: 0; margin: 0; overflow-x: hidden; }
      body { min-height: 100vh; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); background: #fff; }
      header { padding: 18px 20px; border-bottom: 1px solid var(--line); }
      h1 { margin: 0; color: var(--pine); font-size: 18px; }
      main { padding: 20px; }
      .card { max-width: 100%; padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
      h2 { margin: 0 0 8px; font-size: 15px; }
      p { margin: 0; overflow-wrap: anywhere; }
      .muted { margin-top: 8px; color: var(--muted); }
      :focus-visible { outline: 3px solid #2d7658; outline-offset: 3px; }
      @media (max-width: 430px) { header, main { padding-left: 14px; padding-right: 14px; } }
    </style>
  </head>
  <body>
    <header><h1>XpertApply Assistant</h1></header>
    <main>
      <section class="card" aria-labelledby="statusHeading">
        <h2 id="statusHeading">Application context</h2>
        <p id="status" role="status" aria-live="polite">Checking for a job application page…</p>
        <p id="detail" class="muted" hidden></p>
      </section>
    </main>
    <script src="assistant.js"></script>
  </body>
</html>
