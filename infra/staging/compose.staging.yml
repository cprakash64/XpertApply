# XpertApply STAGING stack. Self-contained on purpose: it is NOT an overlay on docker-compose.yml, so it
# cannot inherit that file's development defaults (public passwords, 0.0.0.0 ports, `env_file: .env`).
#
# Run it only through infra/staging/staging-compose.sh, which verifies the checkout path, the project
# name and the rendered configuration before every Compose command. Nothing here may reference the
# production checkout, project (`xpertapply`), volumes, networks, secrets or ports (8020 / 3000).
#
# Required variables use `${NAME:?message}` so a missing secret stops rendering instead of silently
# falling back to a default. Every container variable is listed explicitly below (no env_file), so a
# stray production variable on the host or in a file cannot leak into a staging container.
name: xpertapply-staging

x-staging-app-env: &app-env
  APP_ENV: ${APP_ENV:?set APP_ENV=staging}
  DEBUG: "false"
  SECRET_KEY: ${SECRET_KEY:?set a staging-only SECRET_KEY}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
  REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
  CORS_ORIGINS: ${CORS_ORIGINS:?set the staging web origin}
  EXTENSION_ALLOWED_IDS: ${EXTENSION_ALLOWED_IDS:?list the approved test extension ids}
  WORKDAY_CREDENTIALS_ENCRYPTION_KEY: ${WORKDAY_CREDENTIALS_ENCRYPTION_KEY:?}
  PEOPLE_DATA_ENCRYPTION_KEY: ${PEOPLE_DATA_ENCRYPTION_KEY:?}
  DEMOGRAPHICS_ENCRYPTION_KEY: ${DEMOGRAPHICS_ENCRYPTION_KEY:-}
  DEMOGRAPHICS_ENCRYPTION_REQUIRED: "false"
  GOOGLE_OAUTH_ENABLED: "false"
  # AI is off unless a separate, provider-capped key is supplied for staging only.
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  # Every external data provider and the scheduled job-board ingestion stay off in staging.
  JOB_INGESTION_ENABLED: "false"
  PEOPLE_RECOMMENDATIONS_ENABLED: "false"
  PEOPLE_ROLLOUT_MODE: disabled
  PEOPLE_ROLLOUT_PERCENTAGE: "0"
  PEOPLE_OUTREACH_AI_ENABLED: "false"
  PEOPLE_OPENAI_WEB_DISCOVERY_ENABLED: "false"
  APOLLO_API_KEY: ""
  HUNTER_API_KEY: ""
  PDL_API_KEY: ""
  BRIGHTDATA_API_TOKEN: ""
  UPLOAD_DIR: /app/uploads
  # Migrations are an explicit release step (staging-compose.sh migrate), never a startup side effect.
  RUN_MIGRATIONS_ON_STARTUP: "false"
  PYTHONUNBUFFERED: "1"

x-staging-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  postgres:
    <<: *hardening
    image: postgres:16-alpine          # same major version as production's base compose
    container_name: xpertapply-staging-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]               # no published port, and no route to the edge network
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    <<: *hardening
    image: redis:7-alpine
    container_name: xpertapply-staging-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--save", "", "--appendonly", "no", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [internal]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}

  api:
    <<: *hardening
    build:
      context: ../../apps/api
    image: xpertapply-staging-api:local
    container_name: xpertapply-staging-api
    environment: *app-env
    ports:
      - "127.0.0.1:${STAGING_API_PORT:-8021}:8000"
    volumes:
      - generated_files:/app/generated
      - uploaded_files:/app/uploads
    networks: [internal, edge]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 512
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s
    command: sh /app/scripts/start-api.sh

  # Not started by default: `staging-compose.sh up --with-workers`.
  worker:
    <<: *hardening
    profiles: ["workers"]
    build:
      context: ../../apps/api
    image: xpertapply-staging-api:local
    container_name: xpertapply-staging-worker
    environment: *app-env
    networks: [internal, edge]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    stop_grace_period: 30s
    command: celery -A app.workers.tasks.celery_app worker --loglevel=info --concurrency=1

  scheduler:
    <<: *hardening
    profiles: ["workers"]
    build:
      context: ../../apps/api
    image: xpertapply-staging-api:local
    container_name: xpertapply-staging-scheduler
    environment: *app-env
    networks: [internal, edge]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    healthcheck:
      disable: true
    stop_grace_period: 15s
    command: celery -A app.workers.tasks.celery_app beat --loglevel=info

  # Not started by default and built only in the website-integration stage:
  # `staging-compose.sh up --with-web`. NEXT_PUBLIC_* are compiled into the bundle.
  web:
    <<: *hardening
    profiles: ["web"]
    build:
      context: ../../apps/web
      args:
        NEXT_PUBLIC_API_URL: https://${STAGING_API_HOST:-api-staging.xpertapply.com}
        NEXT_PUBLIC_SITE_URL: https://${STAGING_WEB_HOST:-staging.xpertapply.com}
        NEXT_PUBLIC_CHROME_EXTENSION_URL: ""
    image: xpertapply-staging-web:local
    container_name: xpertapply-staging-web
    environment:
      NEXT_PUBLIC_API_URL: https://${STAGING_API_HOST:-api-staging.xpertapply.com}
      NEXT_PUBLIC_SITE_URL: https://${STAGING_WEB_HOST:-staging.xpertapply.com}
      NEXT_PUBLIC_CHROME_EXTENSION_URL: ""
    ports:
      - "127.0.0.1:${STAGING_WEB_PORT:-3001}:3000"
    networks: [edge]
    depends_on:
      api: {condition: service_healthy}
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256

volumes:
  postgres_data:
    name: xpertapply-staging-postgres-data
  generated_files:
    name: xpertapply-staging-generated-files
  uploaded_files:
    name: xpertapply-staging-uploaded-files

networks:
  # No route out and no published ports: PostgreSQL and Redis live only here.
  internal:
    name: xpertapply-staging-internal
    internal: true
  edge:
    name: xpertapply-staging-edge
