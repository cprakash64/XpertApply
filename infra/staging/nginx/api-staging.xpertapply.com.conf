# STEP 2 (after the certificate exists). TEMPLATE for api-staging.xpertapply.com. Staging only: it proxies to the loopback
# port 127.0.0.1:8021 and touches no production host. Do not paste into an existing production server block.
server {
    listen 80;
    listen [::]:80;
    server_name api-staging.xpertapply.com;
    access_log /var/log/nginx/api-staging.xpertapply.com.access.log;
    error_log  /var/log/nginx/api-staging.xpertapply.com.error.log;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api-staging.xpertapply.com;          # exact host

    ssl_certificate     /etc/letsencrypt/live/api-staging.xpertapply.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-staging.xpertapply.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:xa_staging_ssl:5m;
    ssl_session_tickets off;

    access_log /var/log/nginx/api-staging.xpertapply.com.access.log;
    error_log  /var/log/nginx/api-staging.xpertapply.com.error.log;

    # Short HSTS and no includeSubDomains: this must not pin the production parent domain.
    add_header Strict-Transport-Security "max-age=300" always;
    # Staging must never be indexed or mistaken for the product.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Résumé uploads and document downloads; the API enforces its own limits below this.
    client_max_body_size 12m;
    client_body_timeout 30s;

    location / {
        proxy_pass http://127.0.0.1:8021;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Edge proxy: overwrite, do not append, so a client cannot forge its address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 130s;
        # No cookies cross hosts: staging has its own origin, so browser storage and tokens are separate.
        proxy_cookie_domain off;
    }
}
