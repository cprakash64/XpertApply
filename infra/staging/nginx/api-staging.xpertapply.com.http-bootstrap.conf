# STEP 1 (before a certificate exists): install ONLY this file for api-staging.xpertapply.com, reload nginx, request the
# certificate with certbot webroot, then replace it with api-staging.xpertapply.com.conf. TEMPLATE: copy it into
# /etc/nginx/sites-available/ by hand during the TLS runbook; this repository never edits live nginx.
server {
    listen 80;
    listen [::]:80;
    server_name api-staging.xpertapply.com;          # exact host: never a wildcard, never default_server

    access_log /var/log/nginx/api-staging.xpertapply.com.access.log;
    error_log  /var/log/nginx/api-staging.xpertapply.com.error.log;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 404;
    }
}
