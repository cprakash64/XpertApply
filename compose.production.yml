services:
  postgres:
    ports: !reset []
    restart: unless-stopped

  redis:
    ports: !reset []
    restart: unless-stopped

  api:
    ports: !override
      - "127.0.0.1:8020:8000"
    restart: unless-stopped

  worker:
    restart: unless-stopped

  scheduler:
    restart: unless-stopped

  web:
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_CHROME_EXTENSION_URL: ${NEXT_PUBLIC_CHROME_EXTENSION_URL:-}
    ports: !override
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
