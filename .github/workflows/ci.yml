name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        working-directory: apps/api
        # The DEV set: CI runs ruff and pytest, neither of which is in the
        # production runtime file. `requirements-dev.txt` pulls the runtime set
        # first, so the two cannot drift.
        run: pip install -r requirements-dev.txt
      - name: Lint backend
        working-directory: apps/api
        run: ruff check app
      - name: Test backend
        working-directory: apps/api
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend
        working-directory: apps/web
        run: npm install
      - name: Typecheck frontend
        working-directory: apps/web
        run: npm run typecheck
      - name: Lint frontend
        working-directory: apps/web
        run: npm run lint
      - name: Test frontend
        working-directory: apps/web
        run: npm test
      - name: Build frontend
        working-directory: apps/web
        run: npm run build

  extension:
    runs-on: ubuntu-latest
    # The dropdown adapters do bounded real-time waits, so the suite is not
    # instant. A wedged vitest worker pool has stalled for minutes at a time
    # locally, so cap the job rather than let a hung pool hold a runner.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # vitest 4 declares ^20 || ^22 || >=24. Pin 22: it is what the suite
          # is developed and run against, and 20.x is untested here.
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/extension/package-lock.json
      - name: Install extension
        working-directory: apps/extension
        # `npm ci`, not `npm install`: the lockfile is in sync with
        # package.json, and CI must not silently resolve a dependency tree
        # different from the one the release package is built from.
        run: npm ci
      - name: Typecheck extension
        working-directory: apps/extension
        run: npm run typecheck
      - name: Build extension
        working-directory: apps/extension
        # BEFORE the tests, deliberately. dist/ is not committed, and
        # src/__tests__/generated_manifest.test.ts asserts against the
        # GENERATED dist/manifest.json — the artifact Chrome actually loads,
        # including that host_permissions cannot reach an employer frame until
        # the user grants it. That spec skips itself when dist/ is absent, so
        # running the tests first would quietly skip the permission-model
        # assertions instead of enforcing them. Build also uses the production
        # profile, so a build that cannot produce a shippable artifact fails.
        run: npm run build
      - name: Test extension
        working-directory: apps/extension
        run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Check committed secrets
        run: |
          # Match the shape of a real OpenAI key (classic, project, and service
          # account forms) rather than the bare substring "sk-", which also
          # occurs inside ordinary words such as "risk-", "ask-" and
          # "queue-microtask-" — and inside this very check, so the old
          # substring form could never pass. Only tracked files are scanned,
          # because a committed secret is by definition tracked. Lines marked
          # with an allowlist pragma are known non-secret test fixtures.
          if git grep -nIE 'sk-(proj-|svcacct-|admin-)?[A-Za-z0-9_-]{32,}' \
               | grep -v 'pragma: allowlist secret'; then
            echo "::error::Possible committed API key (see matches above)"
            exit 1
          fi
          echo "No committed API keys found."
