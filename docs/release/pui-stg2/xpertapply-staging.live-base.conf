# XpertApply staging only.
# Production virtual hosts are configured separately.

server {
    listen 80;
    server_name staging.xpertapply.com api-staging.xpertapply.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/xpertapply-staging-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name staging.xpertapply.com;

    ssl_certificate /etc/letsencrypt/live/xpertapply-staging/fullchain.pem;
    ssl_certificate_key <KEYPATH>;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_connect_timeout 10s;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}

server {
    listen 443 ssl;
    server_name api-staging.xpertapply.com;

    ssl_certificate /etc/letsencrypt/live/xpertapply-staging/fullchain.pem;
    ssl_certificate_key <KEYPATH>;

    location / {
        proxy_pass http://127.0.0.1:8021;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_connect_timeout 10s;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}
