# XpertApply staging only.
# Production virtual hosts are configured separately.

# S1: Referrer-Policy keeps the app's own value (the recovery pages send no-referrer so a reset token never leaks in a
# Referer) and falls back to the production value for everything else, including nginx-generated responses.
map $upstream_http_referrer_policy $xa_staging_referrer_policy {
    default $upstream_http_referrer_policy;
    ""      "strict-origin-when-cross-origin";
}

server {
    listen 80;
    server_name staging.xpertapply.com api-staging.xpertapply.com;

    add_header X-Robots-Tag "noindex, nofollow" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/xpertapply-staging-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name staging.xpertapply.com;

    add_header X-Robots-Tag "noindex, nofollow" always;

    # S1 security headers. HSTS is short, host-only (no includeSubDomains, no preload).
    add_header Strict-Transport-Security "max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy $xa_staging_referrer_policy always;

    # Staging must not advertise itself: keep robots.txt and sitemap.xml as 404 (as the current build does) so crawlers
    # can still fetch pages and see the noindex header. An add_header inside a location REPLACES the inherited ones,
    # so the header is repeated here.
    location = /robots.txt {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy $xa_staging_referrer_policy always;
        return 404;
    }
    location = /sitemap.xml {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy $xa_staging_referrer_policy always;
        return 404;
    }

    ssl_certificate /etc/letsencrypt/live/xpertapply-staging/fullchain.pem;
    ssl_certificate_key <KEYPATH>;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_hide_header Referrer-Policy;   # re-emitted once via $xa_staging_referrer_policy
        proxy_hide_header X-Robots-Tag;      # the server-level header is the single noindex source on staging

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_connect_timeout 10s;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}

server {
    listen 443 ssl;
    server_name api-staging.xpertapply.com;

    # S1 (JSON API): same HSTS and nosniff the production API host already sends.
    add_header Strict-Transport-Security "max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;

    add_header X-Robots-Tag "noindex, nofollow" always;

    ssl_certificate /etc/letsencrypt/live/xpertapply-staging/fullchain.pem;
    ssl_certificate_key <KEYPATH>;

    location / {
        proxy_pass http://127.0.0.1:8021;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_connect_timeout 10s;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}
