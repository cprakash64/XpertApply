# Staging web security headers (S1). Production-equivalent, except a short HSTS. Included at server level AND inside any
# location that defines its own add_header (nginx drops inherited add_header directives in such a location).
# No includeSubDomains, no preload: the parent domain also serves production, www and api.
add_header Strict-Transport-Security "max-age=300" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
# $xa_referrer_policy is defined by the map in the vhost: the app's own value (no-referrer on the recovery pages) wins.
add_header Referrer-Policy $xa_referrer_policy always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), accelerometer=(), gyroscope=(), fullscreen=(), clipboard-read=(), clipboard-write=(self)" always;
